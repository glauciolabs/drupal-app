apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: drupal
spec:
  virtualhost:
    fqdn: drupal.glauciolabs.work
    tls:
      secretName: drupal-cert-secret
  routes:
    - conditions:
        - prefix: /
      services:
        - name: drupal
          port: 80
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: drupal-cert
spec:
  secretName: drupal-cert-secret
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - drupal.glauciolabs.work
