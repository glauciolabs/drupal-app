apiVersion: v1
kind: ConfigMap
metadata:
  name: drupal-settings
data:
  settings.php: |
    <?php
    $databases['default']['default'] = [
      'database' => getenv('DRUPAL_DB_NAME'),
      'username' => getenv('DRUPAL_DB_USER'),
      'password' => getenv('DRUPAL_DB_PASSWORD'),
      'host' => getenv('DRUPAL_DB_HOST'),
      'port' => '3306',
      'namespace' => 'Drupal\\mysql\\Driver\\Database\\mysql',
      'driver' => 'mysql',
      'autoload' => 'core/modules/mysql/src/Driver/Database/mysql/',
    ];

    $settings['hash_salt'] = '8d92f7c6e1a4b35890c2e4f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6';
    $settings['update_free_access'] = FALSE;
    $settings['container_yamls'][] = $app_root . '/' . $site_path . '/default.services.yml';
    $settings['file_scan_ignore_directories'] = [
      'node_modules',
      'bower_components',
    ];
    $settings['entity_update_batch_size'] = 50;
    $settings['entity_update_backup'] = TRUE;
    $settings['config_sync_directory'] = 'sites/default/files/config_sync';

