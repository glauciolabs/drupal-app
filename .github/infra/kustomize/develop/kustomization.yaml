apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

images:
  - name: drupal
    newName: ghcr.io/glauciolabs/drupal-app
    newTag: v11.4.11-develop.50
    digest: sha256:eabba719ae54151b843e6c46bbbcebca9cf947c52c7815ac67190cf821bfec6b

patches:
  - target:
      kind: Deployment
      name: drupal-mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /databases/drupal-app-develop/drupal-mysql
  - target:
      kind: Deployment
      name: drupal
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: /dados/drupal-app-develop/drupal-files
