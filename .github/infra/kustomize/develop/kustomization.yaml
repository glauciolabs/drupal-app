apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

images:
  - name: drupal
    newName: ghcr.io/glauciolabs/drupal-app
    newTag: v11.4.11-develop.51
    digest: sha256:ab4eea37859067c531cc388092cfe3b449676e56b974dacb4f714622615d7222

patches:
  - target:
      kind: Deployment
      name: drupal-mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /databases/drupal-app-develop/drupal-mysql
  - target:
      kind: Deployment
      name: drupal
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: /dados/drupal-app-develop/drupal-files
