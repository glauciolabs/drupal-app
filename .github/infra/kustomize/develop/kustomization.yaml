apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

images:
  - name: drupal
    newName: drupal
    newTag: 10-apache

patches:
  - target:
      kind: Deployment
      name: drupal-mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /databases/drupal-app-develop/drupal-mysql
  - target:
      kind: Deployment
      name: drupal
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: /dados/drupal-app-develop/drupal-files
