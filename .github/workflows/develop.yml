name: Delivery

on:
  push:
    branches: [develop]

permissions:
  contents: write
  packages: write

jobs:
  delivery:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Scan Dockerfile
        run: snyk container test --file=Dockerfile --severity-threshold=high --fail-on=all
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/glauciolabs/drupal-app:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan published image
        run: snyk container test ghcr.io/glauciolabs/drupal-app@${{ steps.image.outputs.digest }} --file=Dockerfile --severity-threshold=high --fail-on=all
      - name: Update GitOps desired state
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('.github/infra/kustomize/develop/kustomization.yaml')
          text = path.read_text()
          old = '    newName: drupal\n    newTag: 10-apache'
          new = f'    newName: ghcr.io/glauciolabs/drupal-app\n    digest: {os.environ["DIGEST"]}'
          if old not in text:
              raise SystemExit('expected Drupal image configuration was not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/infra/kustomize/develop/kustomization.yaml
          git commit -m "deploy(drupal): ${DIGEST} [skip ci]"
          git push origin HEAD:develop
