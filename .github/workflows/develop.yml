name: Develop delivery

env:
  VERSION: 11.4.11

on:
  push:
    branches: [develop]

permissions:
  contents: write
  packages: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kustomize
        run: kubectl kustomize .github/infra/kustomize/develop > /dev/null

  build:
    needs: validate
    runs-on: self-hosted
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/glauciolabs/drupal-app:v${{ env.VERSION }}-develop.${{ github.run_number }}
          provenance: mode=max
          sbom: true

  security:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull published image for local analysis
        env:
          IMAGE: ghcr.io/glauciolabs/drupal-app@${{ needs.build.outputs.digest }}
        run: docker pull --platform=linux/arm64 "$IMAGE"
      - name: Scan published image
        env:
          IMAGE: ghcr.io/glauciolabs/drupal-app@${{ needs.build.outputs.digest }}
        run: snyk container test "$IMAGE" --file=Dockerfile --platform=linux/arm64 --severity-threshold=high --fail-on=all

  deploy:
    needs: [build, security]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Update GitOps desired state
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          path = Path('.github/infra/kustomize/develop/kustomization.yaml')
          text = path.read_text()
          new = f'    newName: ghcr.io/glauciolabs/drupal-app\n    digest: {os.environ["DIGEST"]}'
          text, replacements = re.subn(
              r'    newName: (?:drupal|ghcr\.io/glauciolabs/drupal-app)\n(?:    (?:newTag|digest): .+\n?)?',
              new + '\n',
              text,
          )
          if replacements != 1:
              raise SystemExit('expected Drupal image configuration was not found')
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/infra/kustomize/develop/kustomization.yaml
          git commit -m "deploy(drupal): ${DIGEST} [skip ci]"
          git push origin HEAD:develop
